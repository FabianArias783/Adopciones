<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARP Track - Chofer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        body { background-color: #f8f9fa; }
        .login-container { max-width: 400px; margin: 50px auto; padding: 20px; }
        .dashboard-container { display: none; padding: 20px; }
        .hidden { display: none !important; }
        #scanner-container { width: 100%; height: 300px; background: #000; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="login-section" class="login-container card shadow">
        <div class="card-body">
            <h3 class="text-center mb-4">MARP Track</h3>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
            <div id="login-error" class="text-danger mt-2 text-center hidden">Error de credenciales</div>
        </div>
    </div>

    <div id="dashboard-section" class="dashboard-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>Hola, <span id="user-name">Chofer</span></h4>
            <button id="logout-btn" class="btn btn-outline-danger btn-sm">Salir</button>
        </div>

        <div class="card mb-3">
            <div class="card-body text-center">
                <button id="scan-btn" class="btn btn-lg btn-success w-100 mb-2">📷 Escanear Manifiesto</button>
                <div id="reader" style="width: 100%" class="hidden"></div>
                <button id="stop-scan-btn" class="btn btn-secondary mt-2 hidden">Cancelar Escaneo</button>
            </div>
        </div>

        <h5>Mis Servicios Recientes</h5>
        <div id="services-list" class="list-group">
            <div class="text-center text-muted">Cargando...</div>
        </div>
    </div>

    <!-- QR Scanner Lib -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="js/app.js"></script>
</body>
</html>
