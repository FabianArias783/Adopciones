<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Tráfico - MARP Track</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f3f5; }
        .login-container { max-width: 400px; margin: 80px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .dashboard-container { display: none; padding: 20px; }
        .hidden { display: none !important; }
        .card-metric { border-left: 5px solid #0d6efd; }
    </style>
</head>
<body>

    <div id="login-section" class="login-container">
        <h3 class="text-center mb-4">MARP Panel</h3>
        <form id="login-form">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
        <div id="login-error" class="text-danger mt-2 text-center hidden">Error de credenciales</div>
    </div>

    <div id="dashboard-section" class="dashboard-container">
        <nav class="navbar navbar-light bg-white mb-4 shadow-sm p-3">
            <span class="navbar-brand mb-0 h1">MARP Track Panel</span>
            <div>
                <span class="me-3">Hola, <span id="user-name">Usuario</span></span>
                <button id="logout-btn" class="btn btn-outline-danger btn-sm">Salir</button>
            </div>
        </nav>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card card-metric shadow-sm">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">Total Servicios</h6>
                        <h2 id="total-count">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-metric shadow-sm" style="border-left-color: #198754;">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">Realizados</h6>
                        <h2 id="completed-count">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-metric shadow-sm" style="border-left-color: #dc3545;">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">No Realizados</h6>
                        <h2 id="failed-count">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5>Resumen de Actividad</h5>
                        <div style="height: 300px;">
                            <canvas id="activityChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5>Servicios Recientes</h5>
                <div class="table-responsive">
                    <table class="table table-hover" id="services-table">
                        <thead>
                            <tr>
                                <th>Folio</th>
                                <th>Cliente</th>
                                <th>Chofer</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
